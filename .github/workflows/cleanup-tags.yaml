name: Delete image tags

# 一次性运维工具：删除误推的镜像标签（两端同时删）。
# 只按 tag 删除，且拒绝删除 latest 与纯数字版本号，避免误伤正常发布。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要删除的标签（不能是 latest 或版本号如 0.8.5）"
        required: true
      targets:
        description: "both / hub / ghcr"
        required: false
        default: both

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            latest|main|master) echo "::error::refuse to delete '$TAG'"; exit 1 ;;
          esac
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+ ]]; then
            echo "::error::refuse to delete version tag '$TAG'"; exit 1
          fi
          echo "will delete tag: $TAG"

      - name: Delete from GHCR
        if: inputs.targets == 'both' || inputs.targets == 'ghcr'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # ghcr 的 registry API 不支持 DELETE manifest（返回 405），
          # 只能通过 GitHub Packages REST API 按「版本」删除。
          api="https://api.github.com/users/${OWNER}/packages/container/xg-icons-hub/versions"
          versions=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "${api}?per_page=100")
          ids=$(printf '%s' "$versions" \
                | jq -r --arg t "$TAG" '.[] | select(((.metadata.container.tags) // []) | index($t)) | .id')
          if [ -z "$ids" ]; then echo "ghcr: no version carries tag '$TAG'"; exit 0; fi
          for id in $ids; do
            # 一个 package version 可以同时挂多个 tag，删 version 会把它们一起删掉。
            siblings=$(printf '%s' "$versions" | jq -r --arg t "$TAG" --argjson id "$id" \
                       '.[] | select(.id == $id) | ((.metadata.container.tags) // [])[] | select(. != $t)' || true)
            if [ -n "$siblings" ]; then
              echo "::error::ghcr version $id also carries tag(s): $siblings — refusing to delete"
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                   -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "${api}/${id}")
            echo "ghcr delete version $id -> HTTP $code"
            [ "$code" = "204" ] || [ "$code" = "200" ] || exit 1
          done

      - name: Delete from Docker Hub
        if: inputs.targets == 'both' || inputs.targets == 'hub'
        env:
          TAG: ${{ inputs.tag }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 先按 digest 删 manifest：这一步需要 delete 动作，Read & Write 级 PAT
          # 只授予 pull,push（返回 401）；失败则回退到 Hub 的 tag API。
          echo "credential shapes: user=${#HUB_USER} chars, token=${#HUB_TOKEN} chars, token prefix ${HUB_TOKEN:0:9}"
          auth=$(curl -s -w '\n%{http_code}' -u "${HUB_USER}:${HUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${HUB_USER}/xg-icons-hub:pull,push")
          acode=$(printf '%s' "$auth" | tail -1)
          body=$(printf '%s' "$auth" | sed '$d')
          if [ "$acode" != "200" ]; then
            echo "::error::token exchange failed (HTTP $acode)"
            printf '%s' "$body" | head -c 300; echo
            exit 1
          fi
          TOK=$(printf '%s' "$body" | jq -r .token)
          echo "hub auth ok, token ${#TOK} chars"
          # 解码 registry token，确认这次到底拿到了哪些动作（判断 token 权限级别）
          python3 - "$TOK" <<'PYEOF'
          import base64, json, sys
          seg = sys.argv[1].split(".")[1]
          seg += "=" * (-len(seg) % 4)
          d = json.loads(base64.urlsafe_b64decode(seg))
          print("granted:", [(a.get("type"), a.get("actions")) for a in d.get("access", [])])
          PYEOF
          hdr=$(curl -s -o /dev/null -D - -H "Authorization: Bearer $TOK" \
                -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
                "https://registry-1.docker.io/v2/${HUB_USER}/xg-icons-hub/manifests/${TAG}")
          code=$(printf '%s' "$hdr" | head -1 | awk '{print $2}')
          D=$(printf '%s' "$hdr" | tr -d '\r' | grep -i '^docker-content-digest:' | awk '{print $2}' || true)
          echo "hub ${TAG} -> HTTP ${code:-?} digest=${D:-none}"
          if [ "$code" = "404" ] || [ -z "$D" ]; then echo "hub: tag not found, nothing to do"; exit 0; fi
          # 删 manifest 会让所有指向同一 digest 的标签一起消失（latest 常与版本标签共享 digest）。
          # Guard 只检查了标签名，这里再逐个核对，发现兄弟标签就拒绝执行。
          accept='application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'
          all_tags=$(curl -s -H "Authorization: Bearer $TOK" \
                     "https://registry-1.docker.io/v2/${HUB_USER}/xg-icons-hub/tags/list" \
                     | jq -r '.tags[]?' || true)
          siblings=""
          for t in $all_tags; do
            [ "$t" = "$TAG" ] && continue
            td=$(curl -s -o /dev/null -D - -H "Authorization: Bearer $TOK" -H "Accept: ${accept}" \
                  "https://registry-1.docker.io/v2/${HUB_USER}/xg-icons-hub/manifests/${t}" \
                  | tr -d '\r' | grep -i '^docker-content-digest:' | awk '{print $2}' || true)
            [ "$td" = "$D" ] && siblings="$siblings $t"
          done
          if [ -n "$siblings" ]; then
            echo "::error::digest ${D} is shared with tag(s):${siblings} — refusing to delete (would remove them too)"
            exit 1
          fi
          code=$(curl -s -o /tmp/hub_del.json -w '%{http_code}' -X DELETE \
                 -H "Authorization: Bearer $TOK" \
                 "https://registry-1.docker.io/v2/${HUB_USER}/xg-icons-hub/manifests/${D}")
          echo "hub delete ${TAG} -> HTTP $code"
          cat /tmp/hub_del.json 2>/dev/null || true
          if [ "$code" = "401" ]; then
            # registry 的 DELETE manifest 需要 delete 动作，Read & Write 级 PAT 只给 pull,push。
            # Hub 的 tag API 按标签删、不动 manifest：实测 PAT + `Authorization: JWT` 返回 204。
            echo "registry delete denied; trying Hub tag API ..."
            JWT=$(curl -s -H 'Content-Type: application/json' \
                  -d "{\"username\":\"${HUB_USER}\",\"password\":\"${HUB_TOKEN}\"}" \
                  https://hub.docker.com/v2/users/login/ | jq -r '.token // empty' || true)
            if [ -n "$JWT" ] && [ "$JWT" != "null" ]; then
              echo "hub login ok, jwt ${#JWT} chars"
              for scheme in JWT Bearer; do
                tcode=$(curl -s -o /tmp/hub_tag_del.json -w '%{http_code}' -X DELETE \
                        -H "Authorization: ${scheme} ${JWT}" \
                        "https://hub.docker.com/v2/repositories/${HUB_USER}/xg-icons-hub/tags/${TAG}/")
                echo "hub tag API (${scheme}) delete ${TAG} -> HTTP $tcode"
                cat /tmp/hub_tag_del.json 2>/dev/null || true
                if [ "$tcode" = "204" ] || [ "$tcode" = "200" ] || [ "$tcode" = "202" ]; then exit 0; fi
              done
            else
              echo "hub login failed (PAT rejected by /v2/users/login/)"
            fi
            echo "::error::both registry manifest DELETE and Hub tag API failed — delete the tag manually on hub.docker.com"
            exit 1
          fi
          [ "$code" = "202" ] || [ "$code" = "200" ] || exit 1

      - name: Summary
        run: echo "deleted tag \`${{ inputs.tag }}\` from ${{ inputs.targets }}" >> "$GITHUB_STEP_SUMMARY"
